# Overlay on environments/local/docker-compose.yml for the opt-in local-mode smoke test (tests/integration/run.sh).
# Use only through run.sh: it sets a unique project name, generates the secrets and removes the project afterwards.
# Relative paths below resolve from environments/local/ (the directory of the first Compose file).
services:
  db:
    ports: !reset []
    networks: [default, isolated]

  ollama:
    ports: !reset []
    mem_limit: ${ITEST_OLLAMA_MEMORY:-4g}
    networks: [default, isolated]   # default: model downloads; isolated: reachable by ingestion and the API

  # Synthetic three-drug source database (tests/integration/source-fixture.sql); never the real DrugCentral data.
  src:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: drugcentral
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:?generated by run.sh}
    volumes:
      - ../../tests/integration/source-fixture.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drugcentral"]
      interval: 2s
      retries: 30
    networks: [isolated]

  # Python 3.11 + environments/local/requirements-local.lock; runs ingestion, the API and the in-network checks.
  api:
    build:
      context: ../../tests/integration
      dockerfile: app.Dockerfile
      additional_contexts:
        locallock: .
    environment:
      RAG_PIPELINE: local
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${ITEST_CHAT_MODEL:?set by run.sh}
      OLLAMA_EMBED_MODEL: nomic-embed-text
      OLLAMA_TIMEOUT_SECONDS: "600"
      ANSWER_MODEL_TIMEOUT_SECONDS: "900"
      VECTOR_BACKEND: pgvector
      VECTOR_COLLECTION: drugcentral_local_nomic_embed_text
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: drugcentral_rag
      PGUSER: rag_local
      PGPASSWORD: ${PGPASSWORD:?generated by run.sh}
      PGSSLMODE: disable
      SOURCE_DATABASE_URL: postgresql://postgres:${SOURCE_DB_PASSWORD}@src:5432/drugcentral
      DATASET_VERSION: itest-synthetic-3-drugs
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:?generated by run.sh}
      SESSION_BACKEND: memory
      QUERY_LOG_PATH: /tmp/query.jsonl
    volumes:
      - ../..:/src:ro
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db: {condition: service_healthy}
      src: {condition: service_healthy}
    networks: [isolated]

  # Publishes the API on 127.0.0.1:${ITEST_API_PORT} for host checks; the API itself stays on the internal network.
  proxy:
    build:
      context: ../../tests/integration
      dockerfile: app.Dockerfile
      additional_contexts:
        locallock: .
    command: ["python", "/src/tests/integration/forward.py", "api", "8000"]
    volumes:
      - ../..:/src:ro
    ports:
      - "127.0.0.1:${ITEST_API_PORT:?set by run.sh}:8000"
    depends_on: [api]
    networks: [default, isolated]

networks:
  isolated:
    internal: true   # no internet, no EC2 instance metadata, no other Compose projects
